# File checks: run via Husky `.husky/pre-commit` → `pre-commit run` (do not run `pre-commit install`; it conflicts with Husky).
# Commit messages: Husky + commitlint (`.husky/commit-msg`).
# Manual: `pre-commit run --all-files` (requires `pip install pre-commit`, `pnpm install`, and `npx` on PATH for Prettier + CSpell).
# https://pre-commit.com

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=800"]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict

  - repo: https://github.com/crate-ci/typos
    rev: v1.29.4
    hooks:
      - id: typos

  - repo: local
    hooks:
      - id: cspell-i18n-messages
        name: cspell (locale message JSON)
        language: system
        entry: scripts/cspell-i18n.sh
        pass_filenames: false
        always_run: true
        files: ^(scripts/cspell-i18n\\.sh|cspell-i18n-(de|fr|es|terms)\\.json|locales/(de|fr|es)\\.json)$
      # Fast Rust / Android / i18n gates (ADR-019); clippy stays in CI (scripts/core-build.sh test).
      - id: cargo-fmt
        name: cargo fmt --check
        entry: scripts/cargo.sh fmt --all -- --check
        language: system
        files: \.rs$
        pass_filenames: false
      - id: lint-ui-literals
        name: UI string literals (Compose)
        entry: scripts/lint-ui-literals.sh
        language: system
        files: ^apps/android/.*\.kt$
        pass_filenames: false
      - id: i18n-check
        name: i18n catalogue check
        entry: pnpm run i18n:check
        language: system
        files: ^(locales/.*\.json|crates/i18n-gen/.*)$
        pass_filenames: false
      # Prettier from package.json (mirrors-prettier tags lag behind npm; avoids version skew).
      - id: prettier
        name: prettier
        entry: npx prettier --write
        language: system
        files: \.(cjs|css|html|js|json|json5|jsx|md|mdx|mjs|svelte|ts|tsx|ya?ml)$
        pass_filenames: true
