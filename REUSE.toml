# REUSE 3.x licence annotations (ADR-020 §8, ADR-014). Specification: https://reuse.software/spec-3.3/
# Instead of a header in every file, patterns here assign copyright and licence. Check: `reuse lint`
# (part of `just lint`). Later annotations win over earlier ones (precedence = "override").
version = 1

# Default for everything: source, docs, scripts, UI copy.
[[annotations]]
path = "**"
precedence = "override"
SPDX-FileCopyrightText = "2026 GuardedSleep contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Configuration, lockfiles, test vectors and golden traces are not creative code: CC0 so that
# other projects can reuse the fixtures freely (ADR-021 conformance vectors are meant to be shared).
[[annotations]]
path = [
  "**/*.toml",
  "**/*.lock",
  "**/pnpm-lock.yaml",
  "**/package.json",
  "**/tsconfig*.json",
  ".editorconfig",
  ".gitignore",
  ".dockerignore",
  ".prettierrc.json",
  ".prettierignore",
  ".npmrc",
  "pnpm-workspace.yaml",
  "mise.lock",
  ".mise/locks/**",
  ".core-dep-count",
  "release-please-config.json",
  ".release-please-manifest.json",
  "cspell-i18n-*.json",
  "crates/**/vectors/**",
  "crates/**/scenarios/**",
  "crates/**/*.proptest-regressions",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 GuardedSleep contributors"
SPDX-License-Identifier = "CC0-1.0"

# Screenshot baselines are generated by the project's own tests (never hand-edited).
[[annotations]]
path = ["**/*.png", "**/*.svg"]
precedence = "override"
SPDX-FileCopyrightText = "2026 GuardedSleep contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Gradle wrapper files are copied from the Gradle distribution (Apache-2.0).
[[annotations]]
path = ["**/gradlew", "**/gradlew.bat", "**/gradle/wrapper/gradle-wrapper.jar"]
precedence = "override"
SPDX-FileCopyrightText = "2015 the original authors (Gradle wrapper)"
SPDX-License-Identifier = "Apache-2.0"

# Agent skills and commands generated by `openspec init` / `openspec update` are OpenSpec templates
# (MIT, see the `license:` front matter). Regenerate them instead of editing; they are not ours.
[[annotations]]
path = [".claude/skills/openspec-*/**", ".claude/commands/opsx/**"]
precedence = "override"
SPDX-FileCopyrightText = "2024 OpenSpec Contributors"
SPDX-License-Identifier = "MIT"
