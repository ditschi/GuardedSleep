# https://github.com/crate-ci/typos
# Run: typos   (part of `just lint`)

[default]
# Colon-separated hex (DTLS fingerprints in test fixtures) is not prose.
# Long base64/base64url runs (test PSKs, hashes) are not prose either.
# Config reference: https://github.com/crate-ci/typos/blob/master/docs/reference.md
extend-ignore-re = ["(?:[0-9A-F]{2}:){7,}[0-9A-F]{2}", "[A-Za-z0-9+/_-]{32,}={0,2}"]

[default.extend-words]
# Technical / project terms
DTLS = "DTLS"
SRTP = "SRTP"
WebRTC = "WebRTC"
STUN = "STUN"
TURN = "TURN"
WSS = "WSS"
PSK = "PSK"
HKDF = "HKDF"
DTX = "DTX"
Opus = "Opus"
mDNS = "mDNS"
coturn = "coturn"
# UPnP (router port mapping), Mosquitto (MQTT broker), haeder (STUN host name in the spike)
Pn = "Pn"
Mosquitto = "Mosquitto"
haeder = "haeder"
Headscale = "Headscale"
Tailscale = "Tailscale"
Capacitor = "Capacitor"
SvelteKit = "SvelteKit"
shadcn = "shadcn"
TFLite = "TFLite"
YAMNet = "YAMNet"
MFCC = "MFCC"
ASO = "ASO"
DSFA = "DSFA"
GDPR = "GDPR"
COPPA = "COPPA"
FCM = "FCM"
APNs = "APNs"
OEM = "OEM"
MIUI = "MIUI"
EMUI = "EMUI"
OneUI = "OneUI"
ColorOS = "ColorOS"
TEE = "TEE"
DND = "DND"
i18n = "i18n"
fdroid = "fdroid"
gradle = "gradle"
Avent = "Avent"

[files]
# typos only supports English locales. Non-English message JSON uses CSpell where a dictionary exists (cspell-i18n-*.json).
extend-exclude = [
  ".git/**",
  # Generated vectors, traces and scenarios carry base64 ids that typos would "correct".
  "crates/guardedsleep-core/vectors/**",
  "crates/guardedsleep-sim/scenarios/**",
  "pnpm-lock.yaml",
  "mise.lock",
  "LICENSES/**",
  "LICENSE",
  # Design mockups carry the German copy table next to the English one.
  "openspec/changes/**/mockup/**",
  "locales/de.json",
  "locales/fr.json",
  "locales/es.json",
  "locales/it.json",
  "locales/pt.json",
  "locales/nl.json",
  "locales/pl.json",
  "locales/sv.json",
  "locales/da.json",
  "locales/cs.json",
  "locales/ro.json",
  "locales/zh-Hans.json",
  "locales/ja.json",
  "locales/ko.json",
  "locales/hi.json",
  "locales/ar.json",
  "locales/tr.json",
  "locales/uk.json",
  "locales/id.json",
]
