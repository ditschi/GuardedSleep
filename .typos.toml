[files]
# typos only supports English locales. de/fr/es message JSON uses CSpell (cspell-i18n-*.json).
extend-exclude = [
  ".git/**",
  "pnpm-lock.yaml",
  "apps/mobile/src/lib/i18n/messages/de.json",
  "apps/mobile/src/lib/i18n/messages/fr.json",
  "apps/mobile/src/lib/i18n/messages/es.json",
]
