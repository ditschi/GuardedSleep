# https://github.com/crate-ci/typos
# Run: typos

[default.extend-words]
# Technical / project terms
DTLS = "DTLS"
SRTP = "SRTP"
WebRTC = "WebRTC"
STUN = "STUN"
TURN = "TURN"
WSS = "WSS"
PSK = "PSK"
HKDF = "HKDF"
DTX = "DTX"
Opus = "Opus"
mDNS = "mDNS"
coturn = "coturn"
Headscale = "Headscale"
Tailscale = "Tailscale"
Capacitor = "Capacitor"
SvelteKit = "SvelteKit"
shadcn = "shadcn"
TFLite = "TFLite"
YAMNet = "YAMNet"
MFCC = "MFCC"
ASO = "ASO"
DSFA = "DSFA"
GDPR = "GDPR"
COPPA = "COPPA"
