# Pinned nightly for tools that need unstable compiler output: cargo-public-api (rustdoc JSON, API
# snapshots, scripts/lib/api-snapshot.sh) today, cargo-fuzz later. Never used to build the product,
# which is pinned in the root rust-toolchain.toml.
# The rustdoc JSON format changes with the nightly, so it must stay within what the pinned
# cargo-public-api (mise.toml [vars]) understands; the compatibility table is in
# https://github.com/cargo-public-api/cargo-public-api#compatibility-matrix
# cargo-public-api 0.52.x needs nightly-2025-11-22 or newer. nightly-2026-10-15 (1.101.0) was verified.
# File format: https://rust-lang.github.io/rustup/overrides.html#the-toolchain-file
[toolchain]
channel = "nightly-2026-10-15"
profile = "minimal"
