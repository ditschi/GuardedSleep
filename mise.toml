# Every tool pin except Rust lives here (ADR-020 §1). Rust is pinned in rust-toolchain.toml.
# mise config reference: https://mise.jdx.dev/configuration.html
# Versions were checked with `mise ls-remote <tool>` on 2026-10-20; Renovate bumps them.

[tools]
# Node 22 LTS for the web client toolchain. https://nodejs.org/en/about/previous-releases
node = "22.23.3"
# pnpm 11 through mise, corepack is not used (ADR-020 §5). https://pnpm.io/installation
pnpm = "11.28.6"

# JDK for Gradle, ktfmt and the Android JVM tests (the build image uses the same major version).
# https://mise.jdx.dev/lang/java.html
java = "temurin-21.0.12+101.0.LTS"

# Task runner. https://just.systems/man/en/
just = "1.59.0"
# Git hooks. https://lefthook.dev/
lefthook = "2.2.2"

# Spelling of English text. https://github.com/crate-ci/typos
typos = "1.51.1"
# Workflow linters. https://github.com/rhysd/actionlint and https://docs.zizmor.sh/
actionlint = "1.7.12"
zizmor = "1.31.1"
# Shell script linter (aqua backend). https://www.shellcheck.net/ and https://mise.jdx.dev/dev-tools/backends/aqua.html
"aqua:koalaman/shellcheck" = "0.11.0"
# SPDX/REUSE licence compliance (Python tool, installed with the host uvx/pipx). uv is deliberately not
# pinned: reuse 6.2.0 publishes only an sdist, and mise's locked uv install refuses source builds
# (--no-build). Pin uv here once reuse ships a wheel.
# https://reuse.readthedocs.io/ and https://mise.jdx.dev/dev-tools/backends/pipx.html
"pipx:reuse" = "6.2.0"

# Supply chain and secrets. https://embarkstudios.github.io/cargo-deny/ and
# https://github.com/betterleaks/betterleaks
cargo-deny = "0.20.2"
betterleaks = "1.9.0"

# Rust test runner and TOML formatter. https://nexte.st/ and https://taplo.tamasfe.dev/
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.148"
taplo = "0.10.0"

# Spec-driven change workflow (openspec/), replaces the ADR folder. Needs Node >= 20.19.
# https://github.com/Fission-AI/OpenSpec and https://mise.jdx.dev/dev-tools/backends/npm.html
"npm:@fission-ai/openspec" = "1.14.3"

# ktfmt is a jar, not a binary: the http backend only downloads it, and scripts/lib/ktfmt.sh runs it with
# `java -jar`. https://mise.jdx.dev/dev-tools/backends/http.html
# Maven Central: https://repo1.maven.org/maven2/com/facebook/ktfmt/
"http:ktfmt" = { version = "0.64", url = "https://repo1.maven.org/maven2/com/facebook/ktfmt/{{version}}/ktfmt-{{version}}-with-dependencies.jar" }

[env]
# OpenSpec sends anonymous usage stats and checks npm for updates by default; both are off here
# (AGENTS.md §7.5: no telemetry). Opt-outs: dist/telemetry/index.js and dist/core/version-check.js
# of @fission-ai/openspec 1.14.3, https://github.com/Fission-AI/OpenSpec#telemetry
OPENSPEC_TELEMETRY = "0"
OPENSPEC_NO_UPDATE_CHECK = "1"

[settings]
# Write mise.lock with checksums. https://mise.jdx.dev/dev-tools/mise-lock.html
lockfile = true
# Never use the Node version file of a sub project (none is used).
idiomatic_version_file_enable_tools = []

# Tool versions that mise does not install (a `cargo:` backend would need a host cargo, which the Docker-only
# setup does not require). scripts/lib/api-snapshot.sh reads this one and runs `cargo install` in a container.
# https://github.com/cargo-public-api/cargo-public-api and https://mise.jdx.dev/tasks/task-configuration.html
[vars]
cargo_public_api = "0.52.0"
