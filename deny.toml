# cargo-deny configuration for the whole workspace (ADR-020 §3).
# Reference for the 0.20 format: https://embarkstudios.github.io/cargo-deny/
# The sans-IO layering bans live in deny.core.toml, because bans on a crate's own dependency graph
# cannot be expressed here (see that file). Run everything with `just deny`.

[graph]
all-features = true

[advisories]
# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
# Vulnerabilities are always errors in this config version; yanked and unmaintained crates too.
version = 2
yanked = "deny"
unmaintained = "all"
# Each entry needs a reason and a review date.
ignore = [
  { id = "RUSTSEC-2026-0374", reason = "basic-toml via uniffi_bindgen -> askama (code generation tooling only, never in a shipped binary). UniFFI is pinned exactly and upgraded in its own PR; remove this entry when askama drops basic-toml. Review: 2027-01-20." },
]

[licenses]
# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
# The allow-list is what the AGPL-3.0-or-later project can legally combine (ADR-014, ADR-020 §3).
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "LGPL-2.1-only",
  "LGPL-2.1-or-later",
  "LGPL-3.0-only",
  "LGPL-3.0-or-later",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
]
confidence-threshold = 0.9
# Keep the allow-list from ADR-020 §3 complete even when no current crate needs an entry.
unused-allowed-license = "allow"

[sources]
# https://embarkstudios.github.io/cargo-deny/checks/sources/cfg.html
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[bans]
# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace are not wildcards.
allow-wildcard-paths = true
