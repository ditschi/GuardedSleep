# AC-12 step 1 (both devices): fresh app, permission screen, role, then the gate's own relay and TURN through
# Settings -> Advanced (design: gate-ui-journeys §2). Env: ROLE_TAG (role_baby|role_parent), RELAY,
# TURN, TURN_USER, TURN_PASS. Ids only, never copy text (ADR-016).
# Debug builds start with the project server in the relay list: the flow removes it, so the invite
# the baby shows carries only the gate's relay.
appId: org.guardedsleep.app.dev
---
- launchApp:
    clearState: true
- runFlow: dismiss-system-dialogs.yaml
# The first start shows the permission screen once, before the role choice (device-setup
# "Permissions on first start"). The gate grants the runtime permissions with adb; Continue works
# with every row left open. A slow emulator may raise a system dialog while the app starts: look,
# dismiss, look again.
- retry:
    maxRetries: 4
    commands:
      - runFlow: dismiss-system-dialogs.yaml
      - extendedWaitUntil:
          visible:
            id: "permissions_title"
          timeout: 15000
# The list scrolls; Continue sits below the rows on a phone, so wait for the title, then scroll.
- scrollUntilVisible:
    element:
      id: "permissions_continue"
    visibilityPercentage: 20
    timeout: 20000
- tapOn:
    id: "permissions_continue"
    point: "50%,15%"
- extendedWaitUntil:
    visible:
      id: "role_baby|role_parent"
    timeout: 15000
- tapOn:
    id: "${ROLE_TAG}"
# The role choice goes straight to the pairing screen: no checklist in between.
- extendedWaitUntil:
    visible:
      id: "baby_pair_cancel|parent_pair_cancel"
    timeout: 15000
- tapOn:
    id: "baby_pair_cancel|parent_pair_cancel"
- tapOn:
    id: "home_settings"
# Settings is an overview; the server addresses are on the Advanced page.
- scrollUntilVisible:
    element:
      id: "settings_nav_advanced"
    visibilityPercentage: 50
- tapOn:
    id: "settings_nav_advanced"
- scrollUntilVisible:
    element:
      id: "settings_advanced_toggle"
    visibilityPercentage: 20
    speed: 90
    timeout: 60000
# The row is partly under the gesture bar at the end of the list: tap its upper part.
- tapOn:
    id: "settings_advanced_toggle"
    point: "85%,20%"
# The in-app warning, not a system dialog.
- tapOn:
    id: "dialog_advanced_confirm"
- scrollUntilVisible:
    element:
      id: "settings_url_remove_0"
    centerElement: true
    visibilityPercentage: 20
# Remove the project server entry (this build has no off switch); the first tap can land under the gesture
# bar, so tap the button's upper part until the entry is gone.
- retry:
    maxRetries: 4
    commands:
      - tapOn:
          id: "settings_url_remove_0"
          point: "50%,25%"
          optional: true
      - assertNotVisible:
          id: "settings_url_remove_0"
- scrollUntilVisible:
    element:
      id: "settings_url_new"
    centerElement: true
    visibilityPercentage: 20
    speed: 90
    timeout: 60000
- tapOn:
    id: "settings_url_new"
- inputText: "${RELAY}"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "settings_url_add"
    centerElement: true
    visibilityPercentage: 20
    speed: 90
    timeout: 60000
- tapOn:
    id: "settings_url_add"
- assertVisible:
    id: "settings_url_0"
- assertNotVisible:
    id: "settings_url_1"
- scrollUntilVisible:
    element:
      id: "settings_turn"
    centerElement: true
    visibilityPercentage: 20
- tapOn:
    id: "settings_turn"
- inputText: "${TURN}"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "settings_turn_user"
    centerElement: true
    visibilityPercentage: 20
- tapOn:
    id: "settings_turn_user"
- inputText: "${TURN_USER}"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "settings_turn_pass"
    centerElement: true
    visibilityPercentage: 20
- tapOn:
    id: "settings_turn_pass"
- inputText: "${TURN_PASS}"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "settings_turn_save"
    centerElement: true
    visibilityPercentage: 20
- tapOn:
    id: "settings_turn_save"
- scrollUntilVisible:
    element:
      id: "settings_back"
    direction: UP
    speed: 95
    timeout: 60000
    visibilityPercentage: 50
# Back from the Advanced page lands on the Settings overview, back again on Home. The first tap can
# land while the list still settles; the retry taps again only if Settings is still there.
- tapOn:
    id: "settings_back"
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "settings_back"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "home_title"
          timeout: 4000
