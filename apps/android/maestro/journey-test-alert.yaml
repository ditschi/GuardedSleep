# AC-12 step 4 (parent): the test alert chain over the verified link. The alert plays while the parent app is in
# front (no separate alert screen then), so the end of the probe is its question; the gate also reads the
# parent's alert from the GS_POC log.
appId: org.guardedsleep.app.dev
---
- runFlow: dismiss-system-dialogs.yaml
- tapOn:
    id: "parent_overflow"
- tapOn:
    id: "parent_probe"
- tapOn:
    id: "sheet_probe_run"
- extendedWaitUntil:
    visible:
      id: "sheet_probe_question|test_alert_ok"
    timeout: 40000
# If the full-screen test confirmation did take the screen, OK ends the test and returns to the app.
- runFlow:
    when:
      visible:
        id: "test_alert_ok"
    commands:
      - tapOn:
          id: "test_alert_ok"
- extendedWaitUntil:
    visible:
      id: "sheet_probe_question"
    timeout: 40000
- tapOn:
    id: "sheet_probe_yes"
