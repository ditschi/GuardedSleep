# AC-1 parent: the ambient bar is shown once the pairing verified (scripts/poc/gate.sh launches via DebugLaunchActivity).
# Stable IDs only, never copy (ADR-016); ids from docs/technical/alpha-ux-flows.md §4.
appId: org.guardedsleep.app.alpha
---
# DebugLaunchActivity only starts the service; bring the app's own screen to the front without restarting it.
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "parent_ambient_bar"
    timeout: 15000
