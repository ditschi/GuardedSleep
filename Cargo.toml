[workspace]
resolver = "2"
members = [
  "crates/guardedsleep-core",
  "crates/guardedsleep-sim",
  "crates/uniffi-bindgen",
  "crates/i18n-gen",
]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
