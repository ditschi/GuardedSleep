[workspace]
resolver = "3"
members = [
  "crates/guardedsleep-core",
  "crates/guardedsleep-ffi",
  "crates/guardedsleep-wasm",
  "crates/guardedsleep-sim",
  "crates/guardedsleep-relay",
  "crates/guardedsleep-server",
  "crates/uniffi-bindgen",
  "crates/i18n-gen",
]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# `deny` (not `forbid`) so the generated UniFFI/wasm glue in guardedsleep-core can opt in with a
# module-scoped `#[allow(unsafe_code)]` until the wave-2 facade crates; `forbid` cannot be lifted.
# Crates without FFI glue add a crate-level `#![forbid(unsafe_code)]`. New crates inherit `deny`.
# Docs: https://doc.rust-lang.org/cargo/reference/workspaces.html#the-lints-table
[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
