name: Setup Android SDK
description: >
  Installs the Android SDK packages the Gradle build needs (platform and build-tools versions match
  docker/android-native-build/Dockerfile). With ndk=true it also installs the NDK and cargo-ndk, which
  `scripts/core-build.sh android` needs to cross-compile the ABIs (it points ANDROID_NDK_HOME at this version). The JDK comes from mise (mise.toml).
inputs:
  ndk:
    description: Install the NDK and cargo-ndk ("true" / "false")
    default: "false"
runs:
  using: composite
  steps:
    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
    - name: SDK packages
      shell: bash
      env:
        WITH_NDK: ${{ inputs.ndk }}
      run: |
        yes | sdkmanager --licenses >/dev/null || true
        packages=("platforms;android-37.0" "build-tools;36.0.0")
        if [ "$WITH_NDK" = "true" ]; then packages+=("ndk;30.0.16248370"); fi
        sdkmanager --install "${packages[@]}" >/dev/null
    - name: cargo-ndk version and cache key
      if: inputs.ndk == 'true'
      id: ndk-ver
      shell: bash
      run: |
        version=4.1.2
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "key=cargo-ndk-$version-${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('rust-toolchain.toml') }}" >> "$GITHUB_OUTPUT"
    - name: Restore cargo-ndk
      if: inputs.ndk == 'true'
      id: ndk-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/bin/cargo-ndk
        key: ${{ steps.ndk-ver.outputs.key }}
    - name: Install cargo-ndk
      if: inputs.ndk == 'true' && steps.ndk-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        NDK_VERSION: ${{ steps.ndk-ver.outputs.version }}
      run: cargo install --locked "cargo-ndk@$NDK_VERSION"
    - name: Save cargo-ndk
      if: inputs.ndk == 'true' && steps.ndk-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/bin/cargo-ndk
        key: ${{ steps.ndk-ver.outputs.key }}
