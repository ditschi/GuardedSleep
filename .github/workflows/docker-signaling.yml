# Signaling-server container image (distroless Rust image, `distribution` spec) — see ADR-008.
#
# Triggers:
#   - push to main, paths under crates/, the Rust toolchain pin and docker/signaling-server → publishes :dev + :sha-<short>
#   - push of a manual tag `signaling-server-v*` → publishes :latest, :vX.Y.Z, :vX.Y (+ :vX post-1.0)
#     (releases are manual tags during the alpha; Release Please returns at beta, ADR-020 §10)
#   - pull_request → build check only (read-only token, no registry login, no push)
#   - workflow_dispatch → manual one-off (publishes :dev unless a tag was pushed too)
#
# The build itself lives in docker-image.yml (reusable); native amd64 and arm64 runners, no QEMU.
name: docker-signaling

on:
  push:
    branches: [main]
    tags:
      - "signaling-server-v*"
    paths:
      - "crates/**"
      - "rust-toolchain.toml"
      - "Cargo.*"
      - "docker/signaling-server/**"
      - ".github/workflows/docker-signaling.yml"
      - ".github/workflows/docker-image.yml"
  pull_request:
    paths:
      - "crates/**"
      - "rust-toolchain.toml"
      - "Cargo.*"
      - "docker/signaling-server/**"
      - ".github/workflows/docker-signaling.yml"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: docker-signaling-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    # Upper bound for the called jobs; each of them narrows it (pull requests only get contents: read).
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      image-name: guardedsleep-signaling
      tag-prefix: signaling-server-v
      dockerfile: docker/signaling-server/Dockerfile
      title: GuardedSleep Signaling Server
      description: Rust WebSocket signaling relay with built-in STUN for GuardedSleep – Privacy Baby Monitor.
