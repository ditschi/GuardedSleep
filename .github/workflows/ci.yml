# Quality gates. Every job calls a `just` recipe, so CI and local runs share one definition
# (ADR-020 §9). `ci-ok` is the only check that branch protection requires.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Granted per job.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A missing Docker/KVM/SDK fails the job instead of printing SKIPPED.
  GS_STRICT: "1"
  CORE_BUILD_NATIVE: "1"
  CARGO_HOME_OVERRIDE: /home/runner/.cargo

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # "code" is everything except documentation, so docs-only changes skip the heavy jobs.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!docs/**"
              - "!**/*.md"
              - "!LICENSE"

  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # Squash merges take the PR title as the commit subject (AGENTS.md section 8).
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            security
            style
            test
          requireScope: false

  workflow-lint:
    name: workflow lint (actionlint + zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: actionlint zizmor
          cache_save: ${{ github.event_name != 'pull_request' }}
      - name: actionlint
        run: actionlint
      - name: zizmor (offline, medium and above)
        run: zizmor --offline --min-severity medium .github

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          cache_save: ${{ github.event_name != 'pull_request' }}
      - uses: ./.github/actions/setup-rust
      - run: pnpm install --frozen-lockfile
      - run: just lint

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          cache_save: ${{ github.event_name != 'pull_request' }}
      - uses: ./.github/actions/setup-rust
        with:
          wasm-bindgen: "true"
      # `just test` includes the Android JVM tests; with GS_STRICT=1 they need the SDK.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - run: pnpm install --frozen-lockfile
      - run: just test

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          cache_save: ${{ github.event_name != 'pull_request' }}
      - uses: ./.github/actions/setup-rust
        with:
          wasm-bindgen: "true"
      - run: pnpm install --frozen-lockfile
      - run: just build

  e2e:
    name: browser E2E (Playwright)
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          cache_save: ${{ github.event_name != 'pull_request' }}
      - uses: ./.github/actions/setup-rust
        with:
          wasm-bindgen: "true"
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium (system deps)
        run: pnpm --filter @guardedsleep/e2e exec playwright install --with-deps chromium
      - run: just e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-e2e-artifacts
          path: |
            apps/e2e/test-results/
            apps/e2e/playwright-report/

  # Single required status check. Skipped jobs (path filters) count as success.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, pr-title, workflow-lint, lint, test, build, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if any needed job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' >/dev/null; then
            echo "::error::at least one required job failed or was cancelled"
            exit 1
          fi
