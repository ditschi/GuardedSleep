# Quality gates. Every job calls a `just` recipe, so CI and local runs share one definition
# (ADR-020 §9). `ci-ok` is the only check that branch protection requires.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Granted per job.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Runs on main finish, so every merge gets a result and writes its caches.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # mise.lock must cover every tool; an unlocked bump fails instead of installing unverified binaries.
  # https://mise.jdx.dev/configuration/settings.html#locked
  MISE_LOCKED: "1"
  # A missing Docker/KVM/SDK fails the job instead of printing SKIPPED.
  GS_STRICT: "1"
  CORE_BUILD_NATIVE: "1"
  # Maestro (about 350 MB) drives only the emulator gate (android-native.yml); no job here needs it.
  # https://mise.jdx.dev/configuration/settings.html#disable_tools
  MISE_DISABLE_TOOLS: maestro

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.code.outputs.code }}
      android: ${{ steps.android.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # "code" is everything except documentation, so docs-only changes skip the heavy jobs (the text
      # lint job still runs for them). The filters live in .github/path-filters.yml (shared with
      # `just test-affected`); dorny applies one predicate-quantifier to all filters of a step, so each
      # step reads the whole file and uses only its own output.
      # https://github.com/dorny/paths-filter#usage
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: code
        with:
          predicate-quantifier: every
          filters: .github/path-filters.yml
      # Inputs of the Android build (ABI libs, Kotlin bindings, JVM tests, APKs). The emulator gate has
      # its own, wider filter in android-native.yml.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: android
        with:
          filters: .github/path-filters.yml

  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # A squash merge takes the PR title as the commit subject (AGENTS.md section 8).
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            security
            style
            test
          requireScope: false

  # Cheap and unfiltered: runs on every PR, documentation-only ones included.
  text-lint:
    name: text lint (format, spelling, REUSE, secrets, workflows)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Full history: the secret scan reads every commit, so a PSK that a later commit of the same PR
      # removes again is still found.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-mise
        with:
          cache_save: ${{ github.event_name != 'pull_request' }}
      - run: just lint-text
      - run: just lint-workflows

  lint:
    name: lint (code)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Full history: the code health gate compares against the merge base with origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-mise
        with:
          cache_save: ${{ github.event_name != 'pull_request' }}
      - uses: ./.github/actions/setup-rust
        with:
          wasm-bindgen: "true"
      # ai-health downloads its tree-sitter grammars on first use; the cache keeps the gate offline and
      # fast. The lock names the tree-sitter-language-pack version.
      # https://github.com/actions/cache#inputs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tree-sitter-language-pack
          key: tree-sitter-grammars-${{ runner.os }}-${{ hashFiles('tools/code-health/aihealth.lock.txt') }}
      - run: just lint-code

  # Host Rust, WASM and Android JVM tests. No ABI cross-compile: the JVM tests load the host build of the
  # core, so this job needs the SDK but neither the NDK nor cargo-ndk.
  test:
    name: test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          cache_save: ${{ github.event_name != 'pull_request' }}
      - uses: ./.github/actions/setup-rust
        with:
          wasm-bindgen: "true"
      - uses: ./.github/actions/setup-android
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      # Robolectric downloads its android-all-instrumented jars (about 100 MB per SDK) at test time
      # into the local Maven repository, outside the Gradle cache; a failed download from Maven
      # Central fails every Robolectric class (MavenArtifactFetcher). Cached by the Robolectric
      # version. https://github.com/robolectric/robolectric/blob/master/plugins/maven-dependency-resolver/src/main/java/org/robolectric/internal/dependency/MavenDependencyResolver.java
      # https://github.com/actions/cache#inputs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('apps/android/gradle/libs.versions.toml') }}
          restore-keys: robolectric-
      - run: just test

  build:
    name: build (web)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          cache_save: ${{ github.event_name != 'pull_request' }}
      - uses: ./.github/actions/setup-rust
        with:
          wasm-bindgen: "true"
      - run: just build-web

  # ABI cross-compile, JVM tests, Roborazzi, debug and release APKs, release-surface and core-size
  # checks: one Gradle run (cached). The emulator gate lives in android-native.yml and is not part of ci-ok.
  android:
    name: android (core, tests, screenshots, APKs)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          cache_save: ${{ github.event_name != 'pull_request' }}
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-android
        with:
          ndk: "true"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      # Robolectric downloads its android-all-instrumented jars (about 100 MB per SDK) at test time
      # into the local Maven repository, outside the Gradle cache; a failed download from Maven
      # Central fails every Robolectric class (MavenArtifactFetcher). Cached by the Robolectric
      # version. https://github.com/robolectric/robolectric/blob/master/plugins/maven-dependency-resolver/src/main/java/org/robolectric/internal/dependency/MavenDependencyResolver.java
      # https://github.com/actions/cache#inputs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('apps/android/gradle/libs.versions.toml') }}
          restore-keys: robolectric-
      - run: just verify-android

  e2e:
    # Three Playwright shards (files are split between them), each with its own `just dev` stack and
    # one worker, so test isolation is the same as in a single job. The job id stays `e2e`: a matrix
    # job reports ONE aggregate result to `needs` (failure if any shard failed), so ci-ok is unchanged.
    # https://docs.github.com/en/actions/using-jobs/using-a-matrix-for-your-jobs
    # https://playwright.dev/docs/test-sharding
    name: browser E2E (Playwright, shard ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # Let the other shards finish so one run shows every failing spec.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          cache_save: ${{ github.event_name != 'pull_request' }}
      - uses: ./.github/actions/setup-rust
        with:
          wasm-bindgen: "true"
      # Chromium lives in ~/.cache/ms-playwright and is keyed by the Playwright version. The cache holds
      # the browser only: scripts/lib/e2e.sh still installs the system packages on a hit.
      # https://playwright.dev/docs/browsers#managing-browser-binaries
      # https://github.com/actions/cache#inputs
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' apps/e2e/package.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The recipe installs Chromium (with its system dependencies on a miss, the dependencies alone on a
      # hit) because GS_STRICT=1.
      - run: just e2e -- --shard=${{ matrix.shard }}/3
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-e2e-artifacts-${{ matrix.shard }}
          path: |
            apps/e2e/test-results/
            apps/e2e/playwright-report/

  # Single required status check. Skipped jobs (path filters) count as success.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, pr-title, text-lint, lint, test, build, android, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if any needed job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' >/dev/null; then
            echo "::error::at least one required job failed or was cancelled"
            exit 1
          fi
