# Emulator gate for the native stack (ADR-015/019/020): `just gate` (scripts/poc/local-gate.sh) starts two
# emulators, forces Doze and checks the alerts (AC-1 ... AC-4 [+AC-10]). It runs on PRs touching Android,
# the core, the signaling server or the gate scripts, nightly and on dispatch; it is required on release
# builds (ADR-020 §9).
#
# The build checks (ABI libs, JVM tests, Roborazzi, APKs, release-surface and size checks) are the
# `android` job in ci.yml, which feeds `ci-ok`. This workflow builds its own debug APK because the
# gate must test what the same commit produces.
#
# Flake quarantine (ADR-020 §9): a test that flakes twice in seven days is quarantined with a
# tracking issue. Jobs are never retried as a whole, so do not add retry wrappers here.
#
# Path-filtered workflows cannot be required checks, so this workflow is not part of `ci-ok`.
name: android-native

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "mise.toml"
      - "justfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/android/**"
      - "locales/**"
      - "data/**"
      - "scripts/core-build.sh"
      - "scripts/gradle.sh"
      - "scripts/lib/**"
      - "scripts/poc/**"
      - "docker/android-native-build/**"
      - "docker/android-emulator/**"
      - "docker/signaling-server/**"
      - ".github/actions/**"
      - ".github/workflows/android-native.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "mise.toml"
      - "justfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/android/**"
      - "locales/**"
      - "data/**"
      - "scripts/core-build.sh"
      - "scripts/gradle.sh"
      - "scripts/lib/**"
      - "scripts/poc/**"
      - "docker/android-native-build/**"
      - "docker/android-emulator/**"
      - "docker/signaling-server/**"
      - ".github/actions/**"
      - ".github/workflows/android-native.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      doze_minutes:
        description: "Forced Doze duration for AC-2 (whole minutes)"
        default: "30"

permissions: {}

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # mise.lock must cover every tool; an unlocked bump fails instead of installing unverified binaries.
  # https://mise.jdx.dev/configuration/settings.html#locked
  MISE_LOCKED: "1"
  GS_STRICT: "1"
  CORE_BUILD_NATIVE: "1"

jobs:
  gate:
    name: emulator gate (AC-1 ... AC-4)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      DOZE_MINUTES: ${{ github.event.inputs.doze_minutes || (github.event_name == 'pull_request' && '2' || '30') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          cache_save: ${{ github.event_name != 'pull_request' }}
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-android
        with:
          ndk: "true"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build core and debug APK
        run: just build-android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Gate (emulators, signaling and TURN in containers)
        run: just gate
      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: poc-gate-results
          path: target/poc-gate
          retention-days: 14
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guardedsleep-alpha-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: ignore
