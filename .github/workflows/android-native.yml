# Emulator gate for the native stack (ADR-015/019/020): `just gate` (scripts/poc/local-gate.sh) starts two
# emulators, forces Doze and checks the alerts (AC-1 ... AC-4 [+AC-10]). It runs on PRs touching Android,
# the core, the signaling server or the gate scripts, nightly and on dispatch; it is required on release
# builds (ADR-020 §9).
#
# The build checks (ABI libs, JVM tests, Roborazzi, APKs, release-surface and size checks) are the
# `android` job in ci.yml, which feeds `ci-ok`. This workflow builds its own debug APK because the
# gate must test what the same commit produces.
#
# Flake quarantine (ADR-020 §9): a test that flakes twice in seven days is quarantined with a
# tracking issue. Jobs are never retried as a whole, so do not add retry wrappers here.
#
# The `dev-apk` job (main only, after the gate passed) re-signs the gate-tested debug APK with a fixed
# dev key and publishes it to the rolling `android-dev` pre-release (add-dev-apk-prerelease).
#
# Path-filtered workflows cannot be required checks, so this workflow is not part of `ci-ok`.
name: android-native

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "tools/android-versions.env"
      - "mise.toml"
      - "justfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/android/**"
      - "locales/**"
      - "data/**"
      - "scripts/core-build.sh"
      - "scripts/gradle.sh"
      - "scripts/lib/**"
      - "scripts/poc/**"
      - "tools/poc-images.env"
      - "docker/android-native-build/**"
      - "docker/android-emulator/**"
      - "docker/signaling-server/**"
      - ".github/actions/**"
      - ".github/workflows/android-native.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "tools/android-versions.env"
      - "mise.toml"
      - "justfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/android/**"
      - "locales/**"
      - "data/**"
      - "scripts/core-build.sh"
      - "scripts/gradle.sh"
      - "scripts/lib/**"
      - "scripts/poc/**"
      - "tools/poc-images.env"
      - "docker/android-native-build/**"
      - "docker/android-emulator/**"
      - "docker/signaling-server/**"
      - ".github/actions/**"
      - ".github/workflows/android-native.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      doze_minutes:
        description: "Forced Doze duration for AC-2 (whole minutes)"
        default: "30"

permissions: {}

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # mise.lock must cover every tool; an unlocked bump fails instead of installing unverified binaries.
  # https://mise.jdx.dev/configuration/settings.html#locked
  MISE_LOCKED: "1"
  GS_STRICT: "1"
  CORE_BUILD_NATIVE: "1"

jobs:
  gate:
    name: emulator gate (AC-1 ... AC-4)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      DOZE_MINUTES: ${{ github.event.inputs.doze_minutes || (github.event_name == 'pull_request' && '2' || '30') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          cache_save: ${{ github.event_name != 'pull_request' }}
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-android
        with:
          ndk: "true"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build core and debug APK
        run: just build-android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Gate (emulators, signaling and TURN in containers)
        run: just gate
      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: poc-gate-results
          # The emulators' Android home (AVD images, root-owned files written by the containers) is not a
          # result; reading it fails the upload with EACCES.
          # https://github.com/actions/upload-artifact#upload-using-multiple-paths-and-exclusions
          path: |
            target/poc-gate
            target/turn-lifetime
            !target/poc-gate/android-home
          retention-days: 14
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guardedsleep-alpha-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: ignore

  dev-apk:
    name: publish dev APK (rolling pre-release)
    needs: gate
    # The gate also runs on PRs and nightly; only main (push or manual dispatch) publishes.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: dev-apk
    # contents: write moves the android-dev tag and edits the release. Downloading an artifact of the
    # same run needs no actions: read (only cross-run downloads do).
    # https://github.com/actions/download-artifact#download-artifacts-from-other-workflow-runs-or-repositories
    permissions:
      contents: write
    # Two pushes publish in order; a running publish is never cancelled half-way.
    # https://docs.github.com/en/actions/using-jobs/using-concurrency
    concurrency:
      group: dev-apk
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      APK_NAME: guardedsleep-alpha-dev.apk
    steps:
      - name: Check the dev-apk environment secrets
        env:
          KEYSTORE_B64: ${{ secrets.GS_DEV_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GS_DEV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GS_DEV_KEY_ALIAS }}
        run: |
          missing=0
          for pair in "GS_DEV_KEYSTORE_B64:$KEYSTORE_B64" "GS_DEV_KEYSTORE_PASSWORD:$KEYSTORE_PASSWORD" "GS_DEV_KEY_ALIAS:$KEY_ALIAS"; do
            if [ -z "${pair#*:}" ]; then
              echo "::error::Secret ${pair%%:*} is missing in the GitHub environment dev-apk (see docs/contributing/development.md, Dev APK)"
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guardedsleep-alpha-debug-apk
          path: ${{ runner.temp }}/in
      # The local setup-android action needs the repository on the runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android
      - name: Re-sign and verify
        env:
          KEYSTORE_B64: ${{ secrets.GS_DEV_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GS_DEV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GS_DEV_KEY_ALIAS }}
          WORK: ${{ runner.temp }}
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$WORK/dev.p12"
          mkdir -p "$WORK/out"
          # The password goes through the environment, not the command line (visible in ps).
          export KS_PASS="$KEYSTORE_PASSWORD"
          # Phones run arm64 only: drop the x86_64 libraries (emulator gate only) from a copy, align
          # (16 KB pages for the stored entries) and sign last, since alignment breaks signatures.
          # https://developer.android.com/guide/practices/page-sizes
          cp "$WORK/in/app-debug.apk" "$WORK/arm64.apk"
          zip -q -d "$WORK/arm64.apk" 'lib/x86_64/*'
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -P 16 -f 4 "$WORK/arm64.apk" "$WORK/aligned.apk"
          "$apksigner" sign --ks "$WORK/dev.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out "$WORK/out/$APK_NAME" "$WORK/aligned.apk"
          "$apksigner" verify --print-certs "$WORK/out/$APK_NAME"
          (cd "$WORK/out" && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
      - name: Release notes
        env:
          WORK: ${{ runner.temp }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          short="${SHA:0:7}"
          digest="$(cut -d' ' -f1 "$WORK/out/$APK_NAME.sha256")"
          {
            echo "Dev build of commit [$short](https://github.com/$REPO/commit/$SHA), $(date -u +'%Y-%m-%d %H:%M UTC')."
            echo
            echo "**Unreviewed, debuggable test build from main for testers. This is not a release.**"
            echo "It passed the emulator gate, then was re-signed with the project dev key. It updates in place over"
            echo "earlier dev builds, but not over a Play or release build (different signing key): uninstall first,"
            echo "which deletes the pairing."
            echo
            echo "The APK holds the arm64-v8a libraries only: it installs on arm64 phones, not on x86_64 emulators."
            echo
            echo "SHA-256: \`$digest\`"
          } > "$WORK/notes.md"
          echo "$short" > "$WORK/short"
      - name: Publish to the android-dev pre-release
        env:
          WORK: ${{ runner.temp }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          short="$(cat "$WORK/short")"
          # Move the tag to the tested commit; create it on the first run.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/android-dev" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/android-dev" -f sha="$SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/android-dev -f sha="$SHA" >/dev/null
          fi
          if gh release view android-dev --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit android-dev --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "Dev build $short" --notes-file "$WORK/notes.md"
          else
            gh release create android-dev --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --verify-tag --title "Dev build $short" --notes-file "$WORK/notes.md"
          fi
          gh release upload android-dev --repo "$GITHUB_REPOSITORY" --clobber \
            "$WORK/out/$APK_NAME" "$WORK/out/$APK_NAME.sha256"
      - name: Remove the dev keystore
        if: always()
        env:
          WORK: ${{ runner.temp }}
        run: rm -f "$WORK/dev.p12"
