# ADR-015/019/020 native stack: Rust core + native Android alpha app.
#   android  - cargo-ndk libs, Kotlin bindings, :core and :app JVM tests, Roborazzi screenshot
#              verification, debug + release APKs, core size (AC-6), release APK free of test hooks
#              (ADR-016). Rust-only checks (fmt, clippy, vectors, simulation, WASM) run in ci.yml.
#   gate     - `just gate` (scripts/poc/local-gate.sh): two emulators, forced Doze, alerts
#              (AC-1 ... AC-4 [+AC-10]). Runs on PRs touching Android or the core, nightly and on
#              dispatch; required on release builds (ADR-020 §9).
#
# Flake quarantine (ADR-020 §9): a test that flakes twice in seven days is quarantined with a
# tracking issue. Jobs are never retried as a whole, so do not add retry wrappers here.
#
# Path-filtered workflows cannot be required checks, so this workflow is not part of `ci-ok`.
name: android-native

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "mise.toml"
      - "justfile"
      - "apps/android/**"
      - "locales/**"
      - "scripts/core-build.sh"
      - "scripts/gradle.sh"
      - "scripts/poc/**"
      - "docker/android-native-build/**"
      - "docker/android-emulator/**"
      - ".github/actions/setup-rust/**"
      - ".github/workflows/android-native.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "mise.toml"
      - "justfile"
      - "apps/android/**"
      - "locales/**"
      - "scripts/core-build.sh"
      - "scripts/gradle.sh"
      - "scripts/poc/**"
      - "docker/android-native-build/**"
      - "docker/android-emulator/**"
      - ".github/actions/setup-rust/**"
      - ".github/workflows/android-native.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      doze_minutes:
        description: "Forced Doze duration for AC-2"
        default: "30"

permissions: {}

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GS_STRICT: "1"
  CORE_BUILD_NATIVE: "1"
  CARGO_HOME_OVERRIDE: /home/runner/.cargo

jobs:
  android:
    name: android core + alpha app
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          cache_save: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: ./.github/actions/setup-rust
      - name: cargo-ndk + Android SDK/NDK
        run: |
          cargo install --locked cargo-ndk@4.1.2
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;30.0.16248370" "platforms;android-37.0" "build-tools;36.0.0" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Build core for Android + Kotlin bindings
        run: just build-android
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Unit tests (AC-5), screenshots, debug + release APKs
        working-directory: apps/android
        run: >-
          ./gradlew --no-daemon :core:testDebugUnitTest :app:testDebugUnitTest
          :app:verifyRoborazziDebug :app:assembleDebug :app:assembleRelease
      - name: Core size (AC-6)
        run: scripts/poc/size-check.sh
      - name: No test-only surfaces in release APK (ADR-016)
        run: scripts/poc/release-check.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guardedsleep-alpha-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  gate:
    name: emulator gate (AC-1 ... AC-4)
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      DOZE_MINUTES: ${{ github.event.inputs.doze_minutes || (github.event_name == 'pull_request' && '2' || '30') }}
      APK: ${{ github.workspace }}/target/apk/app-debug.apk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: just
          cache_save: ${{ github.event_name != 'pull_request' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guardedsleep-alpha-debug-apk
          path: target/apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Gate (emulators, signaling and TURN in containers)
        run: just gate
      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: poc-gate-results
          path: target/poc-gate
          retention-days: 14
