# Weekly measurement of the curated public Nostr relays and STUN servers (alpha-connection-model task
# 4.1, docs/contributing/relay-soak.md). Community servers come and go (the spike lost about 6 of 40
# hosts), and nothing in the repository changes when one dies, so a push-triggered run would never see
# it. Not part of `ci-ok`: a failure only notifies. The job that opens or updates the tracking issue is
# separate so that only it holds `issues: write`.
name: relays-weekly

on:
  schedule:
    - cron: "47 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: relays-weekly
  cancel-in-progress: false

env:
  # mise.lock must cover every tool; an unlocked bump fails instead of installing unverified binaries.
  # https://mise.jdx.dev/configuration/settings.html#locked
  MISE_LOCKED: "1"
  # A skipped check is a failed check here: the point of the job is to reach the network.
  GS_STRICT: "1"

jobs:
  check:
    name: measure relays and STUN servers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      failed: ${{ steps.summary.outputs.failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          install_args: node just
          cache_save: false
      - uses: ./.github/actions/setup-rust
      - run: just relays-check
      - name: Failing entries
        id: summary
        if: always()
        run: |
          report=.cache/relays-check/relays-check.json
          if [ -f "$report" ]; then
            echo "failed=$(jq -r '.summary.failed | join(", ")' "$report")" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: relays-check
          path: .cache/relays-check/
          if-no-files-found: warn
          retention-days: 30

  report:
    name: open or update the issue
    needs: check
    if: ${{ always() && needs.check.outputs.failed != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED: ${{ needs.check.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Weekly relay check: failing public relay or STUN entries"
          body="Failing in the weekly check: ${FAILED}.

          Report (artifact \`relays-check\`): ${RUN_URL}

          Runbook: docs/contributing/relay-soak.md (re-vet the entry, mark it \`suspended\` in data/ if it stays down)."
          number="$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
