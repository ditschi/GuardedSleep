# Mobile web (PWA) container image — see ADR-008.
#
# Triggers:
#   - push to main, paths under mobile/protocol → publishes :dev + :sha-<short>
#   - push of tag `mobile-v*` (Release Please) → publishes :latest, :vX.Y.Z, :vX.Y (+ :vX post-1.0)
#   - pull_request → builds only (no push)
#   - workflow_dispatch → manual one-off
#
# Note: the published image is built with VITE_SIGNALING_URL="" so the in-app
# Settings override / localStorage takes effect at runtime. Users who want a
# baked-in URL build locally with docker/stack/compose.yaml or `docker build`.
# See ADR-008 "Web image VITE_SIGNALING_URL default".
name: docker-web

on:
  push:
    branches: [main, master]
    tags:
      - "mobile-v*"
    paths:
      - "docker/mobile-web/**"
      - "apps/mobile/**"
      - "packages/protocol/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/docker-web.yml"
  pull_request:
    paths:
      - "docker/mobile-web/**"
      - "apps/mobile/**"
      - "packages/protocol/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/docker-web.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: guardedsleep-web
  TAG_PREFIX: mobile-v

concurrency:
  group: docker-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: build + push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Compute lowercased owner (GHCR requires lowercase)
        id: owner
        run: |
          o="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "value=$o" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ env.IMAGE_NAME }}
          tags: |
            type=match,pattern=${{ env.TAG_PREFIX }}(.*),group=1,value=latest,priority=900,enable=${{ startsWith(github.ref, format('refs/tags/{0}', env.TAG_PREFIX)) }}
            type=match,pattern=${{ env.TAG_PREFIX }}(\d+\.\d+\.\d+),group=1,prefix=v
            type=match,pattern=${{ env.TAG_PREFIX }}(\d+\.\d+)\.\d+,group=1,prefix=v
            type=match,pattern=${{ env.TAG_PREFIX }}(\d+)\.\d+\.\d+,group=1,prefix=v,enable=${{ !startsWith(github.ref, format('refs/tags/{0}0.', env.TAG_PREFIX)) }}
            type=raw,value=dev,enable={{is_default_branch}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=GuardedSleep Web (PWA)
            org.opencontainers.image.description=Static PWA host (nginx) for GuardedSleep – Privacy Baby Monitor.
            org.opencontainers.image.vendor=GuardedSleep
            org.opencontainers.image.licenses=NOASSERTION

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/mobile-web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_SIGNALING_URL=
            TLS_EXTRA_SAN=
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sanity check tag output
        if: startsWith(github.ref, format('refs/tags/{0}', env.TAG_PREFIX))
        run: |
          echo "Produced tags:"
          printf '  %s\n' ${{ steps.meta.outputs.tags }}
          echo '${{ steps.meta.outputs.tags }}' | grep -q ':latest' \
            || (echo "::error::Tag push did not produce :latest — check TAG_PREFIX vs Release Please config"; exit 1)
