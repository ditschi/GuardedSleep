# Web (PWA) container image — see ADR-008.
# The PWA infers its signaling URL from the page origin, so the image has no build-time signaling URL.
#
# Triggers:
#   - push to main, paths under apps/web, packages/core-wasm and the core crates → publishes :dev + :sha-<short>
#   - push of a manual tag `web-v*` → publishes :latest, :vX.Y.Z, :vX.Y (+ :vX post-1.0)
#     (releases are manual tags during the alpha; Release Please returns at beta, ADR-020 §10)
#   - pull_request → build check only (read-only token, no registry login, no push)
#   - workflow_dispatch → manual one-off (publishes :dev unless a tag was pushed too)
#
# The build itself lives in docker-image.yml (reusable); native amd64 and arm64 runners, no QEMU.
name: docker-web

on:
  push:
    branches: [main]
    tags:
      - "web-v*"
    paths:
      - "docker/web/**"
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - "crates/**"
      - "locales/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "packages/core-wasm/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "mise.toml"
      - ".github/workflows/docker-web.yml"
      - ".github/workflows/docker-image.yml"
  pull_request:
    paths:
      - "docker/web/**"
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - "crates/**"
      - "locales/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "packages/core-wasm/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "mise.toml"
      - ".github/workflows/docker-web.yml"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: docker-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    # Upper bound for the called jobs; each of them narrows it (pull requests only get contents: read).
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      image-name: guardedsleep-web
      tag-prefix: web-v
      dockerfile: docker/web/Dockerfile
      title: GuardedSleep Web (PWA)
      description: Static PWA host (nginx) for GuardedSleep – Privacy Baby Monitor.
      build-args: |
        TLS_EXTRA_SAN=
