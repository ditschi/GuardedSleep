# Weekly smoke check for the iOS path (ADR-020 section 3, add-core-facades): the Swift bindings must still
# generate from the UniFFI library on Linux, although no iOS client exists yet (AGENTS.md section 9). The
# generated files are uploaded for inspection and never committed. Failures notify the owner through the
# normal Actions mail.
name: swift-bindings

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: swift-bindings
  cancel-in-progress: false

env:
  # mise.lock must cover every tool; an unlocked bump fails instead of installing unverified binaries.
  # https://mise.jdx.dev/configuration/settings.html#locked
  MISE_LOCKED: "1"
  CORE_BUILD_NATIVE: "1"

jobs:
  generate:
    name: generate Swift bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          cache_save: false
      - uses: ./.github/actions/setup-rust
      - run: scripts/core-build.sh swift
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-bindings
          path: target/swift-bindings/
          if-no-files-found: error
          retention-days: 14
