# The Content-Security-Policy comes from /etc/nginx/csp-header.conf, which the web build writes
# (apps/web/csp/csp.ts: 'self' plus connect-origins.json plus
# GS_CSP_CONNECT_ORIGINS) and the Dockerfile moves out of the served directory; the vitest
# csp.test.ts fails when the file or this include drifts from it. Every server and location that
# sets its own add_header needs its own include (nginx does not inherit add_header there).
# CSP reference: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CSP
# nginx include: https://nginx.org/en/docs/ngx_core_module.html#include
# No client addresses in any log (AGENTS.md section 7, guardrails 1 and 6). This file is included in
# the http context of the image's nginx.conf, so these two directives apply to both servers below:
# - `access_log off` cancels the image's `access_log /var/log/nginx/access.log main`, whose format
#   starts with $remote_addr and ends with $http_x_forwarded_for.
# - The http error log goes to /dev/null: nginx appends ", client: <address>" to every error of a
#   connection, at every level including crit (an unexpected TLS handshake error, a file nginx cannot
#   open), so no level keeps addresses out; discarding the log does, as for coturn in
#   docker/public-server/compose.yaml. Startup, configuration and worker-exit messages belong to the
#   main context, stay at notice on stderr and carry no client address.
# To debug a running instance, mount an extra file into /etc/nginx/conf.d/ with
# `error_log /dev/stderr info;` and remove it afterwards: while it is there the log has addresses.
# Reference: https://nginx.org/en/docs/http/ngx_http_log_module.html#access_log and
# https://nginx.org/en/docs/ngx_core_module.html#error_log
access_log off;
error_log /dev/null;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;
    include /etc/nginx/csp-header.conf;

    location /signaling {
        proxy_pass http://signaling:8787/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        # The PWA connects to the origin it was served from (apps/web relay-stun.ts), so a WebSocket
        # upgrade on any path goes to the signaling server, which accepts upgrades on every path.
        if ($http_upgrade = "websocket") {
            rewrite ^ /signaling last;
        }
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header X-Frame-Options "DENY" always;
        include /etc/nginx/csp-header.conf;
    }
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;
    include /etc/nginx/csp-header.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;

    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    location /signaling {
        proxy_pass http://signaling:8787/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        # The PWA connects to the origin it was served from (apps/web relay-stun.ts), so a WebSocket
        # upgrade on any path goes to the signaling server, which accepts upgrades on every path.
        if ($http_upgrade = "websocket") {
            rewrite ^ /signaling last;
        }
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header X-Frame-Options "DENY" always;
        include /etc/nginx/csp-header.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
