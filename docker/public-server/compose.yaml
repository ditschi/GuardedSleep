# GuardedSleep public server: signaling (behind the owner's Traefik) and coturn (host networking).
# Design: openspec/changes/alpha-connection-model/design.md section 9; guide: README.md next to this file.
#
#   cp .env.template .env && $EDITOR .env     # then: docker compose up -d
#
# Compose file reference: https://docs.docker.com/reference/compose-file/
name: guardedsleep-public

services:
  signaling:
    # A signaling-server-vX.Y.Z release tag, never `latest` or `dev` (no release exists before group 9
    # of alpha-connection-model lands; the owner cuts the first one).
    image: ghcr.io/${GUARDEDSLEEP_OWNER:?set GUARDEDSLEEP_OWNER, the GitHub owner of the images}/guardedsleep-signaling:${SIGNALING_TAG:?set SIGNALING_TAG to a signaling-server-vX.Y.Z release}
    restart: unless-stopped
    environment:
      PORT: "8787"
      # The built-in STUN is off: coturn answers STUN on 3478 of the same host (design section 7).
      STUN_DISABLED: "1"
      # Traefik is the only way in (no published ports), so the client address comes from its
      # X-Forwarded-For, one hop.
      SIGNALING_TRUST_PROXY: "1"
      SIGNALING_TRUSTED_PROXY_HOPS: "1"
      # Browser origins that may connect; production refuses to start with an empty list. The default is
      # the signaling origin itself, which serves no web client, so no browser page can use the server
      # (native apps send no Origin and are accepted). Add the official web origin here if one exists.
      SIGNALING_ALLOWED_ORIGINS: "${SIGNALING_ALLOWED_ORIGINS:-https://${PUBLIC_HOST}}"
      # The server refuses to start when a URL below names another host than PUBLIC_HOST.
      PUBLIC_HOST: "${PUBLIC_HOST:?set PUBLIC_HOST}"
      TURN_URLS: "${TURN_URLS:?set TURN_URLS}"
      STUN_URLS: "${STUN_URLS:?set STUN_URLS}"
      TURN_SECRET: "${TURN_SECRET:?set TURN_SECRET, generate with: openssl rand -hex 32}"
      TURN_TTL_S: "${TURN_TTL_S:-600}"
      TURN_MAX_LIVE_PER_ADDR: "${TURN_MAX_LIVE_PER_ADDR:-8}"
    networks:
      - traefik
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.guardedsleep-secure.rule=Host(`${PUBLIC_HOST}`) && PathPrefix(`/signaling`)"
      - "traefik.http.routers.guardedsleep-secure.entrypoints=${TRAEFIK_ENTRYPOINT:?set TRAEFIK_ENTRYPOINT to the HTTPS entrypoint name of your Traefik}"
      - "traefik.http.routers.guardedsleep-secure.tls=true"
      - "traefik.http.routers.guardedsleep-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.guardedsleep-secure.middlewares=secure-headers@file"
      - "traefik.http.routers.guardedsleep-secure.service=guardedsleep-signaling"
      - "traefik.http.services.guardedsleep-signaling.loadbalancer.server.port=8787"

  coturn:
    # Same pin as the emulator gate (COTURN_IMAGE in tools/poc-images.env; keep equal, Renovate bumps both).
    image: coturn/coturn:${COTURN_TAG:-4.18.0}
    # Host networking: the relay needs the whole port range and the real client addresses.
    # Docker publishes no ports for it, so the firewall (README) is the only gate.
    network_mode: host
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/lib/coturn
      - /tmp
    cap_drop:
      - ALL
    # /usr/bin/turnserver carries the file capability cap_net_bind_service; without it in the
    # bounding set the exec fails with "Operation not permitted".
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # Option reference: https://github.com/coturn/coturn/blob/master/docker/coturn/turnserver.conf
    # The image entrypoint runs `eval "echo $arg"` on every argument: keep values free of shell
    # characters ($, `, ", spaces), and do not pass -n (echo swallows it).
    command:
      # Logs: none. coturn writes client and peer addresses at levels up to ERROR (a denied peer is an
      # ERROR line with the peer's address, and --log-min-level cannot go above error), so the log goes
      # to /dev/null; scripts/poc/public-server-logs.sh proves it. For debugging only, set
      # TURN_LOG_FILE=stdout in .env, and remove it again afterwards (README, "Logs").
      - --log-file=${TURN_LOG_FILE:-/dev/null}
      - --no-stdout-log
      - --simple-log
      - --fingerprint
      - --realm=${PUBLIC_HOST}
      - --server-name=${PUBLIC_HOST}
      # REST credentials signed by guardedsleep-server with the same secret (design section 7).
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      # Public addresses sit on the interface (no 1:1 NAT), so no --external-ip.
      - --listening-ip=${TURN_IPV4}
      - --listening-ip=${TURN_IPV6}
      - --relay-ip=${TURN_IPV4}
      - --relay-ip=${TURN_IPV6}
      - --listening-port=3478
      - --min-port=${TURN_MIN_PORT:-49160}
      - --max-port=${TURN_MAX_PORT:-49359}
      # turns: on 5349 is terminated by the reverse proxy (Traefik, README "turns: through Traefik"), which
      # forwards plain TURN-over-TCP to 3478: coturn needs no certificate, so TLS stays off (--no-tls; DTLS is off
      # unless --dtls is given, and coturn 4.18 has no --no-dtls option, scripts/poc/public-server-turns-traefik.sh).
      # The two items are the whole difference to the lego variant (compose.lego.yaml): a compose override
      # replaces a `command` list instead of extending it, and a copy of this list would let the security
      # limits below drift apart. Hence two variables, both --no-tls by default (a repeated flag is harmless);
      # .env.template shows the lego values (--cert and --pkey).
      - ${TURN_TLS_ARG_1:---no-tls}
      - ${TURN_TLS_ARG_2:---no-tls}
      # STUN without amplification extras: no RFC 5780 attributes, no software attribute.
      - --no-rfc5780
      - --no-software-attribute
      # WebRTC relays media over UDP only.
      - --no-tcp-relay
      # Abuse limits (design section 7): the quota is per credential (every credential has its own
      # user name), allocations die after two minutes without a refresh, one relay port per allocation.
      - --user-quota=5
      - --max-allocate-lifetime=120
      - --total-quota=${TURN_TOTAL_QUOTA:-200}
      # Bytes per second per session (125000 = 1 Mbit/s); audio needs far less.
      - --max-bps=${TURN_MAX_BPS:-125000}
      - --stale-nonce=600
      - --no-multicast-peers
      # Never relay into private, loopback, link-local (cloud metadata 169.254.169.254) or CGNAT
      # space, and never into this host: TURN must not reach Traefik, the signaling server or any
      # other service here (the host's own public addresses follow the ranges).
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.0.0.0-192.0.0.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=198.18.0.0-198.19.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=${TURN_IPV4}
      - --denied-peer-ip=${TURN_IPV6}

  # OFF for the alpha on the signaling origin (design section 9): whoever controls the origin that
  # serves the web client controls the client completely (PSK, parent secret, microphone), so the
  # web client is never co-hosted on gs.mydata.rocks. Enable only on a separate origin of your own:
  #   docker compose --profile web up -d
  # A test deployment (app.gs.mydata.rocks) uses the guardedsleep-web-staging image instead; /signaling on
  # that web host must not be routed (Traefik rule Host(web) && !PathPrefix(`/signaling`)).
  web:
    profiles: ["web"]
    image: ghcr.io/${GUARDEDSLEEP_OWNER}/guardedsleep-web:${WEB_TAG:-unset}
    restart: unless-stopped
    # No read_only/cap_drop: nginx needs its cache directories and a privilege drop; harden when this
    # profile is first used.
    # The image logs no client addresses (nginx access log off, http error log discarded; README "Logs").
    networks:
      - traefik
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.guardedsleep-web.rule=Host(`${WEB_HOST:-web.invalid}`)"
      - "traefik.http.routers.guardedsleep-web.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.guardedsleep-web.tls=true"
      - "traefik.http.routers.guardedsleep-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.guardedsleep-web.middlewares=secure-headers@file"
      - "traefik.http.services.guardedsleep-web.loadbalancer.server.port=80"

networks:
  traefik:
    external: true
