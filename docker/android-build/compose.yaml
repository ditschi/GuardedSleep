# Reproducible debug APK build: full JDK + Android SDK (avoids host "JRE without compiler" setups).
#
# 1) On the host or in the devcontainer (Node), sync web assets into android/:
#    pnpm install --frozen-lockfile
#    pnpm --filter @guardedsleep/mobile build
#    pnpm --filter @guardedsleep/mobile exec cap sync
#
# 2) Build APK inside this compose service (from repository root):
#    docker compose -f docker/android-build/compose.yaml run --rm apk
#
# APK output: apps/mobile/android/app/build/outputs/apk/debug/guardedsleep-debug-v*.apk (on the mounted repo)
name: guardedsleep-android-apk

services:
  apk:
    build:
      context: .
      dockerfile: Dockerfile
    image: guardedsleep-android-build:local
    volumes:
      # compose file is docker/android-build/ → repo root is ../..
      - ../../:/workspace:cached
      - gradle-home:/root/.gradle
      # Keeps debug.keystore stable across `run --rm`, so `adb install -r` can update the app.
      - android-home:/root/.android
    working_dir: /workspace/apps/mobile/android
    environment:
      ANDROID_HOME: /opt/android-sdk
      # Reduce Gradle daemon issues in one-shot containers
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    command: ["./gradlew", "assembleDebug", "--no-daemon"]

volumes:
  gradle-home:
  android-home:
