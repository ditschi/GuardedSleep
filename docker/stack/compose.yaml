# Full local stack: static PWA (nginx) + signaling — build from the current repo revision.
# From repository root (no .env required — defaults are inlined below via ${VAR:-default}):
#   docker compose -f docker/stack/compose.yaml up --build
#
# Optional: copy docker/stack/.env.example → docker/stack/.env and use
#   --env-file docker/stack/.env
# when you need LAN origins, different ports, or a non-default VITE_SIGNALING_URL.
#
# Then open http://127.0.0.1:8080/ or https://127.0.0.1:8443/ (self-signed cert; browser warning is expected).
# Default compiled signaling URL: wss://127.0.0.1:8443/signaling (proxied to signaling:8787 for mic-friendly HTTPS).
#
# PHONE / another device on your LAN: 127.0.0.1 in that URL is the phone itself — WebSocket will fail (“connection failed”).
# Use docker/stack/.env with your PC’s LAN IP, e.g. VITE_SIGNALING_URL=wss://192.168.1.42:8443/signaling and add
# https://192.168.1.42:8443 to SIGNALING_ALLOWED_ORIGINS, then rebuild (--build). Open https://192.168.1.42:8443 on the phone
# (accept the self-signed warning; hostname mismatch vs cert is normal when using the IP).
name: guardedsleep-local

services:
  signaling:
    build:
      context: ../..
      dockerfile: docker/signaling-server/Dockerfile
    image: guardedsleep-signaling:local
    ports:
      - "${SIGNALING_PORT:-8787}:${SIGNALING_INTERNAL_PORT:-8787}"
    environment:
      PORT: "${SIGNALING_INTERNAL_PORT:-8787}"
      SIGNALING_ALLOWED_ORIGINS: "${SIGNALING_ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1,http://localhost,https://127.0.0.1:8443,https://localhost:8443}"
      SIGNALING_MAX_PARENTS: "${SIGNALING_MAX_PARENTS:-}"
      SIGNALING_PING_INTERVAL_MS: "${SIGNALING_PING_INTERVAL_MS:-}"
      SIGNALING_HELLO_RATE_PER_MIN: "${SIGNALING_HELLO_RATE_PER_MIN:-}"
      SIGNALING_NEW_ROOM_RATE_PER_MIN: "${SIGNALING_NEW_ROOM_RATE_PER_MIN:-}"
      SIGNALING_TRUST_PROXY: "${SIGNALING_TRUST_PROXY:-}"
      SIGNALING_TRUSTED_PROXY_HOPS: "${SIGNALING_TRUSTED_PROXY_HOPS:-}"
      SIGNALING_HELLO_TIMEOUT_MS: "${SIGNALING_HELLO_TIMEOUT_MS:-}"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||8787)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ../..
      dockerfile: docker/mobile-web/Dockerfile
      args:
        VITE_SIGNALING_URL: "${VITE_SIGNALING_URL:-wss://127.0.0.1:8443/signaling}"
        TLS_EXTRA_SAN: "${TLS_EXTRA_SAN:-}"
    image: guardedsleep-web:local
    ports:
      - "${WEB_PORT:-8080}:80"
      - "${WEB_HTTPS_PORT:-8443}:443"
    depends_on:
      signaling:
        condition: service_healthy
    restart: unless-stopped
