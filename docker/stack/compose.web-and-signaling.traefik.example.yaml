# DEPRECATED: use compose.traefik.yaml + traefik.env.example (one domain, configurable via .env).
# Example: Traefik TLS for both the static PWA and the signaling WebSocket.
# Prerequisites: external Docker network `proxy` attached to your Traefik container; DNS for app.example.com and signal.example.com.
#
# Option — pre-built images (GHCR): set `image:` to e.g.
#   ghcr.io/<owner>/guardedsleep-signaling:latest
#   ghcr.io/<owner>/guardedsleep-web:latest
# (use `:dev` until the first release exists; see ADR-008 and docker/stack/README.md Mode B/C.)
#
# Option — build locally (from repo root):
#   docker compose -f docker/signaling-server/compose.build.yaml build
#   docker build -f docker/mobile-web/Dockerfile --build-arg VITE_SIGNALING_URL=wss://signal.example.com -t guardedsleep-web:local .
#
# Then start this stack (adjust domains, cert resolver, entrypoint names):
#   docker compose -f docker/stack/compose.web-and-signaling.traefik.example.yaml --env-file docker/stack/.env up -d
#
# Set SIGNALING_ALLOWED_ORIGINS to the PWA origin, e.g. https://app.example.com
name: guardedsleep-web-signaling-traefik-example

services:
  signaling:
    image: guardedsleep-signaling:local
    environment:
      PORT: "8787"
      # Production image requires a non-empty allowlist; must match browser Origin (e.g. https://app.example.com).
      SIGNALING_ALLOWED_ORIGINS: "${SIGNALING_ALLOWED_ORIGINS:-https://app.example.com}"
      SIGNALING_HELLO_TIMEOUT_MS: "${SIGNALING_HELLO_TIMEOUT_MS:-}"
      SIGNALING_MAX_PARENTS: "${SIGNALING_MAX_PARENTS:-}"
      SIGNALING_PING_INTERVAL_MS: "${SIGNALING_PING_INTERVAL_MS:-}"
      SIGNALING_HELLO_RATE_PER_MIN: "${SIGNALING_HELLO_RATE_PER_MIN:-}"
      SIGNALING_NEW_ROOM_RATE_PER_MIN: "${SIGNALING_NEW_ROOM_RATE_PER_MIN:-}"
      SIGNALING_TRUST_PROXY: "${SIGNALING_TRUST_PROXY:-}"
      SIGNALING_TRUSTED_PROXY_HOPS: "${SIGNALING_TRUSTED_PROXY_HOPS:-}"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.guardedsleep-signaling.rule=Host(`signal.example.com`)"
      - "traefik.http.routers.guardedsleep-signaling.entrypoints=websecure"
      - "traefik.http.routers.guardedsleep-signaling.tls=true"
      - "traefik.http.routers.guardedsleep-signaling.tls.certresolver=letsencrypt"
      - "traefik.http.services.guardedsleep-signaling.loadbalancer.server.port=8787"

  web:
    image: guardedsleep-web:local
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.guardedsleep-web.rule=Host(`app.example.com`)"
      - "traefik.http.routers.guardedsleep-web.entrypoints=websecure"
      - "traefik.http.routers.guardedsleep-web.tls=true"
      - "traefik.http.routers.guardedsleep-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.guardedsleep-web.loadbalancer.server.port=80"

networks:
  proxy:
    external: true
