# Run signaling alone from a pre-built GHCR image. See ADR-008 for tag semantics.
# For the full stack (signaling + web) use docker/stack/compose.ghcr.yaml instead.
#
# Quick usage (no repo clone needed):
#   1. Download this file alongside `.env.example` (or set the variables in your shell).
#   2. Set GUARDEDSLEEP_OWNER and SIGNALING_ALLOWED_ORIGINS.
#   3. docker compose -f compose.ghcr.yaml --env-file .env pull
#   4. docker compose -f compose.ghcr.yaml --env-file .env up -d
#
# Tags:
#   :latest  → most recent stable release (Release Please tag)
#   :dev     → most recent commit on main (may be broken — use during pre-release)
#   :vX.Y.Z  → reproducible deploy of a specific release
name: guardedsleep-signaling

services:
  signaling:
    # Either SIGNALING_IMAGE (full image ref) OR GUARDEDSLEEP_OWNER + SIGNALING_TAG.
    # SIGNALING_IMAGE takes precedence when set.
    image: ${SIGNALING_IMAGE:-ghcr.io/${GUARDEDSLEEP_OWNER:-missing-guardedsleep-owner}/guardedsleep-signaling:${SIGNALING_TAG:-latest}}
    pull_policy: ${PULL_POLICY:-always}
    ports:
      - "${SIGNALING_PORT:-8787}:${SIGNALING_INTERNAL_PORT:-8787}"
    environment:
      PORT: "${SIGNALING_INTERNAL_PORT:-8787}"
      SIGNALING_ALLOWED_ORIGINS: "${SIGNALING_ALLOWED_ORIGINS:-http://127.0.0.1,http://localhost}"
      SIGNALING_MAX_PARENTS: "${SIGNALING_MAX_PARENTS:-}"
      SIGNALING_PING_INTERVAL_MS: "${SIGNALING_PING_INTERVAL_MS:-}"
      SIGNALING_HELLO_RATE_PER_MIN: "${SIGNALING_HELLO_RATE_PER_MIN:-}"
      SIGNALING_NEW_ROOM_RATE_PER_MIN: "${SIGNALING_NEW_ROOM_RATE_PER_MIN:-}"
      SIGNALING_TRUST_PROXY: "${SIGNALING_TRUST_PROXY:-}"
      SIGNALING_TRUSTED_PROXY_HOPS: "${SIGNALING_TRUSTED_PROXY_HOPS:-}"
      SIGNALING_HELLO_TIMEOUT_MS: "${SIGNALING_HELLO_TIMEOUT_MS:-}"
    restart: unless-stopped
