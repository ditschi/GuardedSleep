# DEPRECATED: use compose.traefik.yaml + traefik.env.example (configurable via .env, no editing).
# Example only: Traefik labels for TLS + domain on the signaling service.
# Replace signal.example.com, network name, cert resolver, and entrypoint names to match your Traefik.
# See: docs/contributing/signaling-traefik.md
name: guardedsleep-signaling-traefik-example

services:
  signaling:
    image: guardedsleep-signaling:local
    environment:
      PORT: "8787"
      # Production image sets NODE_ENV=production: leave empty → process exits (fail-fast).
      # Set e.g. SIGNALING_ALLOWED_ORIGINS=https://app.example in your .env next to this file.
      SIGNALING_ALLOWED_ORIGINS: "${SIGNALING_ALLOWED_ORIGINS:-}"
      SIGNALING_HELLO_TIMEOUT_MS: "${SIGNALING_HELLO_TIMEOUT_MS:-}"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.guardedsleep-signaling.rule=Host(`signal.example.com`)"
      - "traefik.http.routers.guardedsleep-signaling.entrypoints=websecure"
      - "traefik.http.routers.guardedsleep-signaling.tls=true"
      - "traefik.http.routers.guardedsleep-signaling.tls.certresolver=letsencrypt"
      - "traefik.http.services.guardedsleep-signaling.loadbalancer.server.port=8787"

networks:
  proxy:
    external: true
