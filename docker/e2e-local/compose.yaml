# One-shot local E2E: browser + optional hybrid Android (nested docker compose via socket).
# From repository root: pnpm run e2e:docker
#
# Uses host networking so WebRTC/loopback matches CI (127.0.0.1:5173 + :18787).
# Requires Linux + Docker. Hybrid emulator needs /dev/kvm on the Docker host (or very slow software emu).
name: guardedsleep-e2e-local

services:
  e2e:
    build:
      context: .
      dockerfile: Dockerfile
    image: guardedsleep-e2e-local:local
    network_mode: host
    shm_size: "2gb"
    working_dir: /workspace
    volumes:
      - ../..:/workspace:cached
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      CI: "true"
      GUARDEDSLEEP_E2E_IN_DOCKER: "1"
      USE_DOCKER_EMULATOR: "${USE_DOCKER_EMULATOR:-1}"
      RUN_WSS_STACK: "${RUN_WSS_STACK:-1}"
      EMULATOR_ALLOW_NO_KVM: "${EMULATOR_ALLOW_NO_KVM:-1}"
      EMULATOR_WAIT_TIMEOUT_SEC: "${EMULATOR_WAIT_TIMEOUT_SEC:-600}"
    command: ["auto"]
