[package]
name = "public-lists"
version = "0.0.1"
description = "Curated public Nostr relay and STUN lists (data/*.json): validator, build check and generator (web TypeScript, Android Kotlin, web CSP origins)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true
