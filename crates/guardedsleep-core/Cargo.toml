[package]
name = "guardedsleep-core"
version = "0.0.1"
description = "Sans-IO protocol, pairing and session core for GuardedSleep (ADR-015 PoC)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Derives TypeScript definitions for the wire types (tsify). Enabled only by guardedsleep-wasm; the
# default graph has no wasm-bindgen. Docs: https://github.com/madonoharu/tsify
tsify = ["dep:tsify", "dep:wasm-bindgen"]

[dependencies]
base64 = "0.23"
hkdf = "0.13"
hmac = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
tsify = { version = "0.5.8", optional = true }
wasm-bindgen = { version = "=0.2.129", optional = true }

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
