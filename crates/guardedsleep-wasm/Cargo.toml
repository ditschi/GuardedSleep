[package]
name = "guardedsleep-wasm"
version = "0.0.1"
description = "wasm-bindgen facade over guardedsleep-core for the web client"
edition.workspace = true
license.workspace = true
publish.workspace = true

# `cdylib` is the .wasm module; `lib` lets clippy, tests and cargo-public-api see the crate.
[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
guardedsleep-core = { path = "../guardedsleep-core", features = ["tsify"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"

[lints]
workspace = true
