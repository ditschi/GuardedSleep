[package]
name = "guardedsleep-sim"
version = "0.0.1"
description = "Deterministic host-side system simulation of the GuardedSleep link (ADR-015 AC-9/AC-10, ADR-016 Stage 1)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "guardedsleep_sim"

[[bin]]
name = "gs-sim"
path = "src/main.rs"

[dependencies]
# `testing` for the sealed-signaling test support (a PSK-holding peer and a rewriting relay). The
# simulation is never part of a release build.
guardedsleep-core = { path = "../guardedsleep-core", features = ["testing"] }
# The canary encodes secrets the way a log line might; same version as the core's.
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true
