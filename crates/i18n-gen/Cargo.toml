[package]
name = "i18n-gen"
version = "0.0.1"
description = "Localization catalogue validator and generator (locales/*.json -> web JSON, Android strings.xml)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
