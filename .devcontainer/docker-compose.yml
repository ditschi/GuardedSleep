name: guardedsleep

# Used by: VS Code Dev Containers (see devcontainer.json) and CLI users.
# Repo root is mounted at /workspace so edits and node_modules stay on the host.
#
# CLI examples (from repository root; --project-directory makes Compose read `.devcontainer/.env`):
#   docker compose --project-directory .devcontainer -f .devcontainer/docker-compose.yml build
#   docker compose --project-directory .devcontainer -f .devcontainer/docker-compose.yml run --rm dev pnpm install
#   docker compose --project-directory .devcontainer -f .devcontainer/docker-compose.yml run --rm -it dev bash
#
# Shell with host ports 5173 + 8787 (no pnpm on host): add --service-ports to the `run` above.
# More in docs/contributing/development.md.
#
# Rootless Docker (`docker info` shows `rootless: true`): the bind-mounted /workspace
# is owned by a uid that `node` (1000) cannot write. Export DEV_UID=0 DEV_GID=0 (or via
# `.devcontainer/.env` — see .env.example) so the container user maps back to the host user.

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      # Named context for rust-toolchain.toml and tools/android-versions.env (see the Dockerfile header).
      additional_contexts:
        repo: ..
    image: guardedsleep-dev:local
    volumes:
      # Compose file lives in .devcontainer/ → parent directory is the repo root
      - ..:/workspace:cached
      - ~/.gitconfig:/home/node/.gitconfig:ro
    ports:
      # For CLI dev (see the header): publish with `docker compose run --service-ports`.
      # Dev Containers usually auto-forward; mapping avoids extra config.
      - "5173:5173"
      - "8787:8787"
    working_dir: /workspace
    # Default = container's `node` (uid 1000, gid 1000) — correct for rootful Docker.
    # Rootless Docker: set DEV_UID=0 DEV_GID=0 so container-root maps to the host user.
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    init: true
    # Dev Containers attaches to this; CLI `run ... cmd` overrides the command.
    command: sleep infinity
